<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホース納品・売上管理ツール</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8 max-w-4xl mx-auto">
    
    <!-- Header -->
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">ホース納品管理</h1>
        <button onclick="openSettings()" class="text-gray-500 hover:text-gray-700 bg-white p-2 rounded shadow">
            ⚙️ 目標設定
        </button>
    </header>

    <!-- Dashboard Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <!-- Progress -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-2">今月の売上状況</h2>
            <div class="text-3xl font-bold text-blue-600 mb-2">¥<span id="displayTotal">0</span></div>
            <p class="text-sm text-gray-500 mb-4">月間目標: ¥<span id="displayTargetMin">35,000</span> 〜 ¥<span id="displayTargetMax">40,000</span></p>
            
            <div class="w-full bg-gray-200 rounded-full h-4 mb-2">
                <div id="progressBar" class="bg-blue-500 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="remainingText" class="text-sm font-medium text-red-500">目標まであと: ¥35,000</p>
        </div>

        <!-- Predictions -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-2">💡 今後の納品目安（予測）</h2>
            
            <div class="bg-blue-50 p-3 rounded mb-3">
                <h3 class="text-sm font-bold text-blue-800">通常のペース</h3>
                <p class="text-sm text-blue-900 mt-1" id="paceNormal">データがありません</p>
            </div>

            <div class="bg-yellow-50 p-3 rounded">
                <h3 class="text-sm font-bold text-yellow-800">⚠️ 8円の束がゼロだった場合</h3>
                <p class="text-sm text-yellow-900 mt-1">目標達成に必要な4.5円の束： <br><span class="text-lg font-bold text-red-600" id="paceOnly45">0</span> 束</p>
            </div>
        </div>
    </div>

    <!-- Main Input & History -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Input Form -->
        <div class="md:col-span-1 bg-white p-6 rounded-lg shadow h-fit">
            <h2 class="text-lg font-semibold mb-4">納品を記録</h2>
            <form id="recordForm" onsubmit="addRecord(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">日付</label>
                    <input type="date" id="inputDate" required class="w-full border-gray-300 border rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">8円の束 (1束60本=480円)</label>
                    <input type="number" id="input8" min="0" value="0" class="w-full border-gray-300 border rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">4.5円の束 (1束80本=360円)</label>
                    <input type="number" id="input45" min="0" value="0" class="w-full border-gray-300 border rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors">
                    記録を追加する
                </button>
            </form>
        </div>

        <!-- History -->
        <div class="md:col-span-2 bg-white p-6 rounded-lg shadow overflow-hidden">
            <h2 class="text-lg font-semibold mb-4">今月の履歴</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs leading-normal">
                            <th class="py-3 px-4 text-left">日付</th>
                            <th class="py-3 px-4 text-center">8円(束)</th>
                            <th class="py-3 px-4 text-center">4.5円(束)</th>
                            <th class="py-3 px-4 text-right">金額</th>
                            <th class="py-3 px-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="text-gray-600 font-light">
                        <!-- Records will be injected here -->
                    </tbody>
                </table>
                <div id="noDataMsg" class="text-center py-4 text-gray-500 hidden">記録がありません</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full mx-4">
            <h2 class="text-xl font-bold mb-4">設定</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">月間目標 (最低ライン)</label>
                <input type="number" id="settingTargetMin" step="1000" class="w-full border-gray-300 border rounded p-2">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">月間目標 (上限)</label>
                <input type="number" id="settingTargetMax" step="1000" class="w-full border-gray-300 border rounded p-2">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">納品する曜日</label>
                <div class="flex flex-wrap gap-3">
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="0" class="mr-1"> 日</label>
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="1" class="mr-1"> 月</label>
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="2" class="mr-1"> 火</label>
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="3" class="mr-1"> 水</label>
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="4" class="mr-1"> 木</label>
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="5" class="mr-1"> 金</label>
                    <label class="flex items-center"><input type="checkbox" name="deliveryDay" value="6" class="mr-1"> 土</label>
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeSettings()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">キャンセル</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">保存</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure
        let state = {
            targetMin: 35000,
            targetMax: 40000,
            deliveryDays: [1, 4],
            records: []
        };

        // Initialize
        function init() {
            const saved = localStorage.getItem('hoseData');
            if (saved) {
                state = JSON.parse(saved);
                if (!state.deliveryDays) {
                    state.deliveryDays = [1, 4];
                }
            }
            
            // Set today's date in form
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
            document.getElementById('inputDate').value = localISOTime;
            
            updateUI();
        }

        // Add Record
        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const b8 = parseInt(document.getElementById('input8').value) || 0;
            const b45 = parseInt(document.getElementById('input45').value) || 0;

            if (b8 === 0 && b45 === 0) {
                alert('束数を入力してください');
                return;
            }

            const total = (b8 * 480) + (b45 * 360);

            state.records.push({
                id: Date.now().toString(),
                date: date,
                b8: b8,
                b45: b45,
                total: total
            });

            // Reset inputs
            document.getElementById('input8').value = 0;
            document.getElementById('input45').value = 0;

            saveData();
            updateUI();
        }

        // Delete Record
        function deleteRecord(id) {
            if (confirm('この記録を削除しますか？')) {
                state.records = state.records.filter(r => r.id !== id);
                saveData();
                updateUI();
            }
        }

        // Save to LocalStorage
        function saveData() {
            localStorage.setItem('hoseData', JSON.stringify(state));
        }

        // Update UI
        function updateUI() {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
            const currentMonthPrefix = localISOTime.substring(0, 7);
            
            let monthTotal = 0;
            let sumB8 = 0;
            let sumB45 = 0;

            // Sort records by date descending
            state.records.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';
            
            if (state.records.length === 0) {
                document.getElementById('noDataMsg').classList.remove('hidden');
            } else {
                document.getElementById('noDataMsg').classList.add('hidden');
                state.records.forEach(r => {
                    // Only sum for current month
                    if (r.date.startsWith(currentMonthPrefix)) {
                        monthTotal += r.total;
                        sumB8 += r.b8;
                        sumB45 += r.b45;
                    }

                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-200 hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="py-3 px-4 text-left whitespace-nowrap">${r.date}</td>
                        <td class="py-3 px-4 text-center">${r.b8}</td>
                        <td class="py-3 px-4 text-center">${r.b45}</td>
                        <td class="py-3 px-4 text-right">¥${r.total.toLocaleString()}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteRecord('${r.id}')" class="text-red-500 hover:text-red-700">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Update Dashboard
            document.getElementById('displayTotal').innerText = monthTotal.toLocaleString();
            document.getElementById('displayTargetMin').innerText = state.targetMin.toLocaleString();
            document.getElementById('displayTargetMax').innerText = state.targetMax.toLocaleString();

            const remaining = Math.max(0, state.targetMin - monthTotal);
            const progress = Math.min(100, (monthTotal / state.targetMin) * 100);
            
            document.getElementById('progressBar').style.width = progress + '%';
            
            const remainingText = document.getElementById('remainingText');
            if (remaining === 0) {
                remainingText.innerText = '🎉 目標達成しました！';
                remainingText.className = 'text-sm font-bold text-green-600 mt-2';
            } else {
                remainingText.innerText = `目標まであと: ¥${remaining.toLocaleString()}`;
                remainingText.className = 'text-sm font-medium text-red-500 mt-2';
            }

            // Update Predictions
            updatePredictions(remaining, sumB8, sumB45, currentMonthPrefix);
        }

        function updatePredictions(remaining, sumB8, sumB45, currentMonthPrefix) {
            const pace45 = document.getElementById('paceOnly45');
            const paceNormal = document.getElementById('paceNormal');

            if (remaining === 0) {
                pace45.innerText = "0";
                paceNormal.innerText = "目標達成済みのため、納品は不要です。";
                return;
            }

            const required45 = Math.ceil(remaining / 360);
            pace45.innerText = required45.toLocaleString();

            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();
            
            let totalDeliveryDays = 0;
            for(let d = 1; d <= lastDay; d++) {
                const tempDate = new Date(year, month, d);
                if (state.deliveryDays.includes(tempDate.getDay())) {
                    totalDeliveryDays++;
                }
            }

            const recordedDates = new Set();
            state.records.forEach(r => {
                if (r.date.startsWith(currentMonthPrefix)) {
                    recordedDates.add(r.date);
                }
            });
            const completedDays = recordedDates.size;

            let deliveryDaysLeft = totalDeliveryDays - completedDays;
            if (deliveryDaysLeft < 0) deliveryDaysLeft = 0;

            let ratio8 = 1;
            let ratio45 = 2;
            if (sumB8 + sumB45 > 0) {
                ratio8 = sumB8 / (sumB8 + sumB45);
                ratio45 = sumB45 / (sumB8 + sumB45);
            }

            const avgBundlePrice = (ratio8 * 480) + (ratio45 * 360);
            const totalBundlesNeeded = Math.ceil(remaining / avgBundlePrice);

            if (deliveryDaysLeft > 0) {
                const deliveriesPerWeek = state.deliveryDays.length;
                // 残り必要な総束数を残り日数で割り、1週間分（週の納品日数分）を掛ける
                const bundlesPerWeek = (totalBundlesNeeded / deliveryDaysLeft) * deliveriesPerWeek;
                const est8 = Math.round(bundlesPerWeek * ratio8);
                const est45 = Math.round(bundlesPerWeek * ratio45);
                
                paceNormal.innerHTML = `今月の納品日は残り <b>${deliveryDaysLeft}回</b> です。<br>1週間あたりおよそ <b>8円:${est8}束 / 4.5円:${est45}束</b> 持っていくと目標に届きます。`;
            } else {
                paceNormal.innerHTML = `今月の予定納品日はすべて完了しました。<br>（不足分として 8円:${Math.round(totalBundlesNeeded*ratio8)}束 / 4.5円:${Math.round(totalBundlesNeeded*ratio45)}束 追加で必要です）`;
            }
        }

        // Settings Modal
        function openSettings() {
            document.getElementById('settingTargetMin').value = state.targetMin;
            document.getElementById('settingTargetMax').value = state.targetMax;
            
            const checkboxes = document.querySelectorAll('input[name="deliveryDay"]');
            checkboxes.forEach(cb => {
                cb.checked = state.deliveryDays.includes(parseInt(cb.value));
            });
            
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            state.targetMin = parseInt(document.getElementById('settingTargetMin').value) || 35000;
            state.targetMax = parseInt(document.getElementById('settingTargetMax').value) || 40000;
            
            const selectedDays = Array.from(document.querySelectorAll('input[name="deliveryDay"]:checked'))
                                      .map(cb => parseInt(cb.value));
            if (selectedDays.length === 0) {
                alert('納品する曜日を1つ以上選択してください。');
                return;
            }
            state.deliveryDays = selectedDays;
            
            saveData();
            updateUI();
            closeSettings();
        }

        // Run on load
        window.onload = init;
    </script>
</body>
</html>
